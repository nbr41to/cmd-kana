name: Prepare notarized release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - name: Check release version
        id: metadata
        run: |
          version=$(python3 scripts/check-release.py --version-only)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          test "$(uname -m)" = arm64
      - name: Check Apple signing settings
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD CODESIGN_IDENTITY APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name. See docs/RELEASING.md."
              exit 1
            fi
          done
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Run release checks
        run: ./scripts/check.sh
      - name: Import temporary signing identity
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/cmd-kana-signing.keychain-db"
          password=$(openssl rand -base64 32)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          for variable, filename in [("MACOS_CERTIFICATE_BASE64", "cmd-kana-signing.p12"),
                                     ("APPLE_API_KEY_BASE64", "cmd-kana-notary.p8")]:
              path = Path(os.environ["RUNNER_TEMP"]) / filename
              path.write_bytes(base64.b64decode(os.environ[variable]))
              path.chmod(0o600)
          PY
          security import "$RUNNER_TEMP/cmd-kana-signing.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          xcrun notarytool store-credentials cmd-kana-ci --key "$RUNNER_TEMP/cmd-kana-notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" --keychain "$keychain"
      - name: Sign, notarize, and verify distribution ZIP
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          NOTARY_PROFILE: cmd-kana-ci
          NOTARY_KEYCHAIN: ${{ runner.temp }}/cmd-kana-signing.keychain-db
        run: ./scripts/notarize.sh
      - name: Upload verified ZIP for review
        uses: actions/upload-artifact@v4
        with:
          name: cmd-kana-${{ steps.metadata.outputs.version }}-notarized
          path: |
            target/dist/*-notarized.zip
            target/dist/*-notarized.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Create draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A Release already exists for $RELEASE_TAG; it will not be overwritten."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "target/dist/cmd-kana-$RELEASE_VERSION-macos-notarized.zip" \
            "target/dist/cmd-kana-$RELEASE_VERSION-macos-notarized.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "cmd-kana $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_TAG.md"
          echo "### Signed release draft prepared" >> "$GITHUB_STEP_SUMMARY"
          echo "Complete docs/releases/$RELEASE_TAG-checklist.md before publishing the draft." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing credentials
        if: always()
        run: |
          keychain="$RUNNER_TEMP/cmd-kana-signing.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/cmd-kana-signing.p12" "$RUNNER_TEMP/cmd-kana-notary.p8"
