name: Release unnotarized app

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      CODESIGN_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Validate publication plan and existing Release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 scripts/check-release.py --version-only)
          tag="v$version"
          source_commit=$(git rev-parse HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source=$source_commit" >> "$GITHUB_OUTPUT"
          requested=$(python3 -c 'import json; print(str(json.load(open(".github/release.json"))["publish"]).lower())')
          if [ "$requested" != true ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          state=new
          if existing=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish 2>/dev/null); then
            draft=$(printf '%s' "$existing" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())')
            if [ "$draft" = false ]; then
              echo "Release $tag is already public and will not be changed."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            target=$(printf '%s' "$existing" | python3 -c 'import json,sys; print(json.load(sys.stdin)["targetCommitish"])')
            test "$target" = "$source_commit" || { echo "::error::Existing draft belongs to a different source commit."; exit 1; }
            state=draft
          fi
          if tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null); then
            test "$tag_commit" = "$source_commit" || { echo "::error::An existing tag must not be moved or reused."; exit 1; }
          fi
          test "$(uname -m)" = arm64
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Install Rust components
        if: steps.plan.outputs.publish == 'true'
        run: rustup component add rustfmt clippy
      - name: Run release checks
        if: steps.plan.outputs.publish == 'true'
        run: |
          ./scripts/check.sh
          python3 -m unittest discover -s tests -p 'test_release.py'
      - name: Build and verify unnotarized distribution
        if: steps.plan.outputs.publish == 'true'
        run: |
          ./scripts/archive.sh
          ./scripts/test-public-release.sh
      - name: Upload verified distribution
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cmd-kana-${{ steps.plan.outputs.version }}-unnotarized
          path: |
            target/dist/*-macos.zip
            target/dist/*-macos.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Stage complete Release assets
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
          RELEASE_SOURCE: ${{ steps.plan.outputs.source }}
          RELEASE_STATE: ${{ steps.plan.outputs.state }}
        run: |
          zip="target/dist/cmd-kana-$RELEASE_VERSION-macos.zip"
          if [ "$RELEASE_STATE" = new ]; then
            gh release create "$RELEASE_TAG" "$zip" "$zip.sha256" \
              --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SOURCE" --draft \
              --title "cmd-kana $RELEASE_VERSION（未公証版）" --notes-file "docs/releases/$RELEASE_TAG.md"
          else
            gh release upload "$RELEASE_TAG" "$zip" "$zip.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/cmd-kana-assets.json"
          python3 - "$RUNNER_TEMP/cmd-kana-assets.json" "$RELEASE_VERSION" <<'PY'
          import json
          import sys
          assets = {asset["name"]: asset for asset in json.load(open(sys.argv[1]))["assets"]}
          name = f"cmd-kana-{sys.argv[2]}-macos.zip"
          for required in (name, name + ".sha256"):
              if required not in assets or assets[required]["size"] <= 0:
                  sys.exit(f"Missing or empty release asset: {required}")
          PY
      - name: Publish verified unnotarized Release
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "### Published $RELEASE_TAG (unnotarized)" >> "$GITHUB_STEP_SUMMARY"
          echo "Apple Developer Program credentials were not used. First launch may require Open Anyway in macOS Privacy & Security." >> "$GITHUB_STEP_SUMMARY"
