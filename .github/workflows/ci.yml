name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Check pure input logic
        run: ./scripts/check-input.sh
      - name: Check release metadata
        run: python3 scripts/check-release.py
      - name: Check release metadata regressions
        run: python3 -m unittest discover -s tests -p 'test_release.py'

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Run release checks
        run: ./scripts/check.sh
      - name: Create test distribution
        run: ./scripts/archive.sh
      - name: Verify free distribution and reject false notarization
        run: ./scripts/test-public-release.sh
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: cmd-kana-macos-${{ github.sha }}
          path: |
            target/dist/*.zip
            target/dist/*.sha256
          if-no-files-found: error
          retention-days: 14
